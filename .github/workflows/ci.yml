name: AI-Assisted QA Framework — CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      anthropic_model:
        description: Claude model used to generate candidate test cases
        required: false
        default: claude-haiku-4-5-20251001

jobs:
  validate-reviewed-suite:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest pytest-html

      - name: Validate reviewed test-case artifact
        run: python -m json.tool validation/generated_test_cases.json > /dev/null

      - name: Execute human-reviewed test suite
        run: |
          python -m pytest tests/test_bookings.py -v --html=reports/test-report.html --self-contained-html

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/test-report.html

  generate-candidate-cases:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic python-dotenv

      - name: Generate candidate test cases with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        run: python generator/generate_tests.py

      - name: Upload candidate test cases for human review
        uses: actions/upload-artifact@v4
        with:
          name: candidate-test-cases
          path: validation/generated_test_cases.json
